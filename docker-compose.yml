services:
  # ==============================================================
  # 1. PostgreSQL Database (v16 Alpine)
  # ==============================================================
  postgres:
    image: postgres:16-alpine
    container_name: babyshalls_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-babyshalls}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-babyshalls_secret_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-babyshalls_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-babyshalls} -d ${POSTGRES_DB:-babyshalls_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M

  # ==============================================================
  # 2. Redis In-Memory Cache (v7 Alpine)
  # ==============================================================
  redis:
    image: redis:7-alpine
    container_name: babyshalls_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 100M

  # ==============================================================
  # 3. Backend REST API (Node.js Express + Prisma)
  # ==============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: babyshalls_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-babyshalls}:${POSTGRES_PASSWORD:-babyshalls_secret_password_2026}@postgres:5432/${POSTGRES_DB:-babyshalls_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-babyshalls-jwt-production-secret-malang-2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      KIRIMINAJA_API_KEY: ${KIRIMINAJA_API_KEY:-}
      KIRIMINAJA_BASE_URL: ${KIRIMINAJA_BASE_URL:-https://api.kiriminaja.com}
      ORIGIN_SUBDISTRICT_ID: ${ORIGIN_SUBDISTRICT_ID:-1234}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 450M

  # ==============================================================
  # 4. Frontend Storefront (Next.js 16 Standalone)
  # ==============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: babyshalls_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 550M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

